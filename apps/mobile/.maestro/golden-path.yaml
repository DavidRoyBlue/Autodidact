# Golden-path mobile e2e: sign in → create a course → wait for it on Home →
# start the lesson → see the teacher's first reply.
#
# Mirrors the cross-service golden path (@autodidact/e2e) but through the real
# UI. Run against a backend started with EMBEDDING_PROVIDER=mock AUTH_PROVIDER=mock
# so generation is fast and deterministic.
appId: com.autodidact.app.dev
---
- runFlow: sign-in.yaml

# Create a course: it builds server-side and shows on Home
- tapOn: "New course"
- tapOn: "e.g. Spanish for travel"
- inputText: "TypeScript basics"
- tapOn: "Build my course"
- assertVisible: "Your learning"

# The newest course becomes the continue card once it is ready
- extendedWaitUntil:
    visible: "Start lesson"
    timeout: 600000
- tapOn: "Start lesson"

# The lesson: start it and wait for the teacher's first reply
- tapOn: "Start the lesson"
- extendedWaitUntil:
    notVisible: "Your teacher is thinking"
    timeout: 120000
- tapOn: "Ask a question or answer your teacher"
- inputText: "I understand this module now."
- hideKeyboard
