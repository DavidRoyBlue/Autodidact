# Maestro configuration for the Autodidact mobile e2e flows.
# Runs against a built app on a device/emulator with a real backend reachable
# at the app's apiBaseUrl (use EMBEDDING_PROVIDER=mock AUTH_PROVIDER=mock for a
# deterministic backend).
#
# appId: the installed app's package id (the APK from scripts/run-mobile.sh;
# Expo Go cannot run this app).
appId: com.autodidact.app
flows:
  - "*.yaml"
