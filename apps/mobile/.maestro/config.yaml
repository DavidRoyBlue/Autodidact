# Maestro configuration for the Autodidact mobile e2e flows.
# Runs against a built app on a device/emulator with a real backend reachable
# at the app's apiBaseUrl (use LLM_PROVIDER=mock for a deterministic backend).
#
# appId: the installed app's package id. For a dev/standalone build this is
# com.autodidact.app; for Expo Go use host.exp.Exponent and launch the dev URL.
appId: com.autodidact.app
flows:
  - "*.yaml"
