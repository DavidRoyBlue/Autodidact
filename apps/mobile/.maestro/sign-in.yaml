# Sign-in flow: launch the app and authenticate.
# Requires a seeded test account in the target backend.
# Override credentials with: maestro test -e EMAIL=... -e PASSWORD=... sign-in.yaml
appId: com.autodidact.app.dev
---
- launchApp:
    clearState: true
- assertVisible: "Autodidact"
- tapOn: "Use email instead"
- tapOn: "you@example.com"
- inputText: ${EMAIL ?: "e2e@test.com"}
- tapOn: "Password"
- inputText: ${PASSWORD ?: "password123"}
- tapOn: "Sign In"
# After a successful sign-in the auth store has a session and Home loads.
- assertVisible: "Your learning"
