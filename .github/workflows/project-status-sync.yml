name: Project status sync

# Thin caller — mapping and forward-only rules live in issuekit (see issuekit/README.md).
# Needs the PROJECT_PAT secret (classic PAT, scopes repo + project) because the default
# GITHUB_TOKEN cannot write user-owned Projects V2; without it issuekit no-ops.

on:
  issues:
    types: [opened, labeled, reopened]

concurrency:
  group: project-status-sync-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}
    steps:
      - uses: actions/checkout@v4
      - run: node issuekit/cli.mjs check board-sync --issue "${{ github.event.issue.number }}" --fix
