name: Parent close guard

# Thin caller — the rule and remedy live in issuekit (see issuekit/README.md).

on:
  issues:
    types: [closed]

concurrency:
  group: parent-close-guard-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: node issuekit/cli.mjs check parent-close --issue "${{ github.event.issue.number }}" --fix
