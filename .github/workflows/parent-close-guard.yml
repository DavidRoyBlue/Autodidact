name: Parent close guard

# Enforces: an issue that still has open sub-issues is a parent and must stay open.
# If anyone (a stray Claude session, an accidental board drag) closes an issue that
# has open sub-issues, this reopens it and comments why. Uses the default GITHUB_TOKEN
# (issues: write) — no PAT needed, since this is issue-level, not project-level.

on:
  issues:
    types: [closed]

concurrency:
  group: parent-close-guard-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Reopen if it has open sub-issues
        run: |
          set -euo pipefail

          OPEN_SUBS=$(gh api graphql -f id="$ISSUE_NODE_ID" -f query='
            query($id:ID!){ node(id:$id){ ... on Issue {
              subIssues(first:100){ nodes { number state } } } } }' \
            --jq '[.data.node.subIssues.nodes[] | select(.state=="OPEN") | .number]')

          COUNT=$(jq 'length' <<<"$OPEN_SUBS")
          if [ "$COUNT" -eq 0 ]; then
            echo "Issue #$ISSUE_NUMBER has no open sub-issues — leaving it closed."
            exit 0
          fi

          LIST=$(jq -r 'map("#\(.)") | join(", ")' <<<"$OPEN_SUBS")
          gh issue reopen "$ISSUE_NUMBER" -R "$REPO"
          gh issue comment "$ISSUE_NUMBER" -R "$REPO" --body \
            "♻️ Reopened automatically — this is a parent with **$COUNT open sub-issue(s)** ($LIST). A parent stays open until all of its sub-issues are closed. Close the children first, then this can close."
          echo "Reopened #$ISSUE_NUMBER ($COUNT open sub-issues: $LIST)."
