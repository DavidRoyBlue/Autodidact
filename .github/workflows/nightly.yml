name: Nightly

# Opt-in, scheduled checks that must NOT block PRs: real-provider smoke tests
# (cost money) and, in future, Maestro mobile e2e (needs an emulator).
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Live provider smoke (real OpenAI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Live embedding-provider contract check
        env:
          LIVE_SMOKE: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --filter @autodidact/providers test

  # mobile-e2e (Maestro) is intentionally not wired here yet: it needs a booted
  # emulator + a mock-provider backend. Run manually for now — see
  # apps/mobile/.maestro/README.md. Add as a job once an emulator runner exists.
