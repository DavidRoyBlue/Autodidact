name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  checks: read

jobs:
  semantic:
    name: PR Review / semantic
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fan out, join, route, and fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$HOME/Automation/scripts/pr-review/pr_review.py" run \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number }}" \
            --cwd "$GITHUB_WORKSPACE"

  approve:
    name: PR Review / approve
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/approve-pr ')
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Record SHA-bound human approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REVIEW_ACTOR: ${{ github.actor }}
          PR_REVIEW_COMMENT: ${{ github.event.comment.body }}
        run: |
          python3 "$HOME/Automation/scripts/pr-review/pr_review.py" approve \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.issue.number }}" \
            --actor "$PR_REVIEW_ACTOR" \
            --comment "$PR_REVIEW_COMMENT"
